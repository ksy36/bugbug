name: android-emulator-smoke

on:
  workflow_dispatch:
    inputs:
      firefox_apk_url:
        description: 'Optional debuggable x86_64 Fenix APK URL; empty uses Mozilla CI debug build'
        type: string
        default: ''
      firefox_package:
        description: 'Package name of the optional test APK'
        type: string
        default: 'org.mozilla.fenix.debug'
  # ponytail: also runs on push while iterating; drop once green.
  push:
    paths:
      - 'agents/autowebcompat-repro/**'
      - '.github/workflows/android-emulator-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check Android connection helpers
        env:
          PYTHONPATH: agents/autowebcompat-repro
        run: python3 -m unittest discover -s agents/autowebcompat-repro/tests

      - name: Check KVM
        run: ls -l /dev/kvm

      - name: Build agent image
        run: |
          docker build -f agents/autowebcompat-repro/Dockerfile \
            --target agent -t awc-agent .

      - name: Drive both browsers via their MCP servers
        env:
          ANDROID_FIREFOX_APK_URL: ${{ inputs.firefox_apk_url }}
          ANDROID_FIREFOX_PACKAGE: ${{ inputs.firefox_package }}
        run: |
          docker run --name android-smoke --device /dev/kvm \
            --group-add "$(getent group kvm | cut -d: -f3)" \
            -e ANDROID_FIREFOX_APK_URL -e ANDROID_FIREFOX_PACKAGE \
            -v "$PWD/agents/autowebcompat-repro/smoke_android.py:/app/smoke_android.py:ro" \
            -w /app awc-agent python smoke_android.py

      - name: Collect Android diagnostics
        if: always()
        run: |
          mkdir -p android-smoke-artifacts
          docker cp android-smoke:/tmp/android-smoke-artifacts/. android-smoke-artifacts/ || true

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-diagnostics
          path: android-smoke-artifacts/
          if-no-files-found: ignore
