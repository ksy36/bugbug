[project]
name = "hackbot-agent-autowebcompat-snapshot"
version = "0.1.0"
description = "Local prototype: snapshot broken sites into static, anonymized eval fixtures"
requires-python = ">=3.14"
dependencies = [
    "autowebcompat-tools",
    "claude-agent-sdk>=0.1.30",
    "mozdownload",
    "mozinstall",
    "pydantic-settings>=2.1.0",
    "requests>=2.32.0",
    "six",
]

[tool.uv.sources]
autowebcompat-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hackbot_agents"]
